<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面積學習｜選擇入口</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="shapes.css"><link rel="stylesheet" href="portal.css?v=20261028-24"></head><body><header><span class="brand">▦ 面積學習</span></header><main><section class="surface"><div class="head"><div class="eyebrow">面積學習地圖</div><h1>選擇學習入口</h1><p id="status" role="status">正在確認登入狀態……</p></div><div class="body">
<form id="classLogin" class="login-panel class-panel" hidden><h2>學生：輸入班級代碼</h2><p class="subtle">老師會給你 6 個字的代碼，或請你掃 QR code。</p><label for="classCode">班級代碼</label><input id="classCode" class="code-input" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" required><button id="classButton" class="primary" type="submit">進入學習</button></form>
<div id="choices" class="portal-choices" hidden><a class="card" href="seven.html"><span class="symbol">▦</span>學生學習<span class="subtle">操作圖形、逐步核對</span></a><a id="teacherLink" class="card" href="teacher.html" hidden><span class="symbol">✎</span>教師備課<span class="subtle">調整題目、流程與提示</span></a></div>
<button id="switchTest" class="logout" hidden>切換至 test 測試帳號</button>
<details id="teacherArea" class="teacher-area" hidden><summary>老師登入</summary>
<form id="testLogin" class="login-panel"><h2>測試帳號登入</h2><label>帳號<input id="username" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><label>教師代號（每位老師有自己的教材設定）<select id="teacherCode"><option value="">共用（不分老師）</option></select></label><button id="loginButton" class="primary" type="submit">進入測試工作區</button></form>
<a id="teacherSignin" class="teacher-signin" href="/signin-with-chatgpt?return_to=%2F">網站管理者使用 ChatGPT 帳號登入</a></details>
<button id="logout" class="logout" hidden>登出</button></div></section></main><script src="portal.js?v=20261028-24"></script></body></html>
